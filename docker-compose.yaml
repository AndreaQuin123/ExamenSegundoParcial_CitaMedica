version: "28.3.2"

services:
  postgres:
    image: postgres:15
    container_name: citas_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: citas_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
